# CONFIGURACIÓN OPTIMIZADA PARA VIRTUALIZACIÓN (QEMU/KVM + VirtIO-GPU)
#
# Hardware detectado: 
# - CPU: 2 Cores (Host Passthrough)
# - RAM: 8GB
# - GPU: VirtIO-VGA-GL (Mesa/Virgl)
# - Input: GTK Display Grab

# -----------------------------------------------------
# 1. DEFINICIÓN DE VARIABLES GLOBALES
# -----------------------------------------------------
# Define colores, programas y teclas modificadoras.
source = ~/.config/hypr/conf/variables.conf

# -----------------------------------------------------
# 2. ENTORNO Y DRIVERS (CRÍTICO PARA VM)
# -----------------------------------------------------
# Carga variables de entorno necesarias para Wayland en QEMU.
# Incluye WLR_NO_HARDWARE_CURSORS para evitar el cursor invisible.
source = ~/.config/hypr/conf/environment.conf

# -----------------------------------------------------
# 3. CONFIGURACIÓN DE PANTALLA
# -----------------------------------------------------
# Configura la resolución 1920x1080 y refresco.
source = ~/.config/hypr/conf/monitors.conf

# -----------------------------------------------------
# 4. ENTRADA (TECLADO Y RATÓN)
# -----------------------------------------------------
# Configura la sensibilidad del ratón y desactiva gestos táctiles.
source = ~/.config/hypr/conf/input.conf

# -----------------------------------------------------
# 5. INICIO AUTOMÁTICO
# -----------------------------------------------------
# Lanza Waybar, Wallpaper, Networking, etc.
source = ~/.config/hypr/conf/autostart.conf

# -----------------------------------------------------
# 6. APARIENCIA Y RENDIMIENTO
# -----------------------------------------------------
# Configura bordes, espacios (gaps) y animaciones ligeras.
# Optimizado para reducir carga en la CPU (2 cores).
source = ~/.config/hypr/conf/appearance.conf

# -----------------------------------------------------
# 7. REGLAS Y COMPORTAMIENTO
# -----------------------------------------------------
# Reglas de ventana (flotantes, opacidad) y atajos de teclado.
source = ~/.config/hypr/conf/windowrules.conf
source = ~/.config/hypr/conf/keybinds.conf
